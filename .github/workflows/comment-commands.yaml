name: Issue and PR comment commands
permissions: {}
jobs:
  cherry-pick:
    runs-on: ubuntu-latest
    if: |
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/cherry-pick')
    permissions:
      issues: write
      pull-requests: write
      contents: write
    steps:
    - name: Check if PR is merged
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
      id: check-merged
      with:
        script: |
          const pr = await github.rest.pulls.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number
          });
          return {
            merged: pr.data.merged,
            state: pr.data.state,
            mergeCommit: pr.data.merge_commit_sha
          };
    - name: GERALT debug probe
      run: |
        if [ -f "${GITHUB_EVENT_PATH:-/dev/null}" ]; then
          printf '%s\n' "GERALT_DBG comment.body from event payload:"
          if command -v jq >/dev/null 2>&1; then
            jq -r '.comment.body // "<none>"' "$GITHUB_EVENT_PATH" || printf '%s\n' "GERALT_DBG jq-read-failed"
          else
            printf '%s\n' "GERALT_DBG jq-unavailable"
          fi
        else
          printf '%s\n' "GERALT_DBG no GITHUB_EVENT_PATH"
        fi
        CB=$(cat <<'GERALT_DBG_BODY'
        ${{ toJSON(github.event.comment.body) }}
        GERALT_DBG_BODY
        )
        printf '%s\n' "GERALT_DBG github.event.comment.body=${CB}"
      continue-on-error: true
    - name: Extract target branch
      if: fromJSON(steps.check-merged.outputs.result).merged == true
      id: extract-branch
      env:
        COMMENT_BODY: ${{ github.event.comment.body }}
      run: |
        set -euo pipefail

        # Keep only the first line
        first_line="$(printf '%s' "$COMMENT_BODY" | tr -d '\r' | head -n1)"
        candidate="$(printf '%s' "$first_line" | awk '{print $2}')"

        if [ -z "${candidate:-}" ]; then
          echo "No branch in comment (expected: /cherry-pick <branch>)" >&2
          exit 1
        fi

        # Validate branch format using git
        if ! git check-ref-format --branch "$candidate"; then
          echo "Invalid branch name: $candidate" >&2
          exit 1
        fi

        echo "branch=$candidate" >> "$GITHUB_OUTPUT"
    - name: Checkout repository
      if: fromJSON(steps.check-merged.outputs.result).merged == true
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 0
    - name: GERALT debug probe
      run: |
        BR=$(cat <<'GERALT_DBG_BR'
        ${{ toJSON(steps.extract-branch.outputs.branch) }}
        GERALT_DBG_BR
        )
        printf '%s\n' "GERALT_DBG steps.extract-branch.outputs.branch=${BR}"
        MRG=$(cat <<'GERALT_DBG_MRG'
        ${{ toJSON(steps.check-merged.outputs.result) }}
        GERALT_DBG_MRG
        )
        printf '%s\n' "GERALT_DBG steps.check-merged.outputs.result=${MRG}"
      continue-on-error: true
    - name: Cherry Pick
      if: fromJSON(steps.check-merged.outputs.result).merged == true
      uses: ./.github/actions/cherry-pick
      continue-on-error: true
      id: cherry-pick
      with:
        github-token: ${{ secrets.PR_UPDATE_TOKEN }}
        source-pr: ${{ github.event.issue.number }}
        source-pr-title: ${{ github.event.issue.title }}
        target-branches: ${{ steps.extract-branch.outputs.branch }}
        merge-commit: ${{ fromJson(steps.check-merged.outputs.result).mergeCommit }}
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  issue_comment:
    types:
    - created
    - edited
