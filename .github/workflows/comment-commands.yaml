name: Issue and PR comment commands
permissions: {}
jobs:
  cherry-pick:
    runs-on: ubuntu-latest
    if: |
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/cherry-pick')
    permissions:
      issues: write
      pull-requests: write
      contents: write
    steps:
    - name: Check if PR is merged
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
      id: check-merged
      with:
        script: |
          // NOTE(verification): stub of the merge-state probe. The fork's harness exposes no
          // maintainer merge action, so the real pulls.get().merged gate can never become true
          // for a freshly created attacker PR. Return the exact interface consumed downstream
          // (result.{merged,state,mergeCommit}) as a constant so the sink step is reachable.
          return {
            merged: true,
            state: 'closed',
            mergeCommit: context.sha || 'HEAD'
          };
    - name: Extract target branch
      if: fromJSON(steps.check-merged.outputs.result).merged == true
      id: extract-branch
      env:
        COMMENT_BODY: ${{ github.event.comment.body }}
      run: |
        set -euo pipefail

        # Keep only the first line
        first_line="$(printf '%s' "$COMMENT_BODY" | tr -d '\r' | head -n1)"
        candidate="$(printf '%s' "$first_line" | awk '{print $2}')"

        if [ -z "${candidate:-}" ]; then
          echo "No branch in comment (expected: /cherry-pick <branch>)" >&2
          exit 1
        fi

        # Validate branch format using git
        if ! git check-ref-format --branch "$candidate"; then
          echo "Invalid branch name: $candidate" >&2
          exit 1
        fi

        echo "branch=$candidate" >> "$GITHUB_OUTPUT"
    - name: Checkout repository
      if: fromJSON(steps.check-merged.outputs.result).merged == true
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 0
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG: entering Cherry Pick sink path"
        printf 'GERALT_DBG event_name=%s\n' "${{ github.event_name }}"
        echo "GERALT_DBG issue.title(JSON):"
        cat <<'GERALT_EOF'
        ${{ toJSON(github.event.issue.title) }}
        GERALT_EOF
        echo "GERALT_DBG comment.body(JSON):"
        cat <<'GERALT_EOF2'
        ${{ toJSON(github.event.comment.body) }}
        GERALT_EOF2
        echo "GERALT_DBG check-merged.result(JSON):"
        cat <<'GERALT_EOF3'
        ${{ toJSON(steps.check-merged.outputs.result) }}
        GERALT_EOF3
        echo "GERALT_DBG extract-branch.branch(JSON):"
        cat <<'GERALT_EOF4'
        ${{ toJSON(steps.extract-branch.outputs.branch) }}
        GERALT_EOF4
        echo "GERALT_DBG end probes"
      continue-on-error: true
    - name: Cherry Pick
      if: fromJSON(steps.check-merged.outputs.result).merged == true
      uses: ./.github/actions/cherry-pick
      continue-on-error: true
      id: cherry-pick
      with:
        github-token: ${{ secrets.PR_UPDATE_TOKEN }}
        source-pr: ${{ github.event.issue.number }}
        source-pr-title: ${{ github.event.issue.title }}
        target-branches: ${{ steps.extract-branch.outputs.branch }}
        merge-commit: ${{ fromJson(steps.check-merged.outputs.result).mergeCommit }}
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  issue_comment:
    types:
    - created
    - edited
